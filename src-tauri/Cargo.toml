[package]
name = "whispertube"
version = "0.2.0"
description = "Local-first YouTube transcription with whisper.cpp"
authors = ["WhisperTube"]
edition = "2021"

[lib]
name = "whispertube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
regex = "1"
sha2 = "0.10"
url = "2"
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Releases use raw .exe/.AppImage; macOS .app.tar.gz support is unconditional.
# Do not enable the updater's legacy Windows ZIP / Linux gzip feature without
# reviewing its archive dependency and the release workflow formats together.
tauri-plugin-updater = { version = "2.11.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2"
sysinfo = "0.33"

[target.'cfg(unix)'.dependencies]
# Already in the dependency graph. Use the platform's siginfo_t/WAIT constants
# instead of duplicating incompatible Linux/macOS FFI layouts.
libc = "0.2"
