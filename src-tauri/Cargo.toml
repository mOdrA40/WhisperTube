[package]
name = "whispertube"
version = "0.1.2"
description = "Local-first YouTube transcription with whisper.cpp"
authors = ["WhisperTube"]
edition = "2021"

[lib]
name = "whispertube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
url = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "time"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
