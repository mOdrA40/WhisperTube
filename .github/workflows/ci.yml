name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows checks
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Frontend build
        shell: pwsh
        run: |
          npm ci
          npm run build

      - name: Frontend regression tests
        shell: pwsh
        run: npm run test:frontend -- --run

      - name: Frontend dependency audit
        shell: pwsh
        run: npm audit --audit-level=high

      - name: Tracked-file secret scan
        shell: pwsh
        run: .\scripts\check-secrets.ps1

      - name: Rust format
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: RustSec dependency audit
        shell: pwsh
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock

      - name: Rust clippy
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: PowerShell parser checks
        shell: pwsh
        run: |
          $files = @('scripts/setup-windows.ps1', 'scripts/install-cuda-engine.ps1', 'scripts/check-secrets.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$file parser error: $($errors | Out-String)"
            }
            Write-Output "$file syntax OK"
          }

  shell:
    name: Shell script checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bash parser checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/setup-macos.sh
          bash -n scripts/setup-linux.sh
          bash -n scripts/build-macos.sh
          bash -n scripts/build-linux.sh
