[package]
name = "whispertube"
version = "0.2.5"
description = "Local-first YouTube transcription with whisper.cpp"
authors = ["WhisperTube"]
edition = "2021"

[lib]
name = "whispertube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Reuse dependencies already present in the application graph for release gates.
serde_json = "1"
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
base64 = "0.22"
memmap2 = "0.9.10"
minisign-verify = "0.2.5"
semver = "1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# Keep streamed package downloads on the updater's certificate and proxy stack.
reqwest-updater = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "system-proxy"] }
# Preserve native SQLite and statement caching without the optional Wasm backend.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "cache"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
regex = "1"
libloading = "0.8"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
url = "2"
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Releases use raw .exe/.AppImage; macOS .app.tar.gz support is unconditional.
# Do not enable the updater's legacy Windows ZIP / Linux gzip feature without
# reviewing its archive dependency and the release workflow formats together.
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2"
sysinfo = "0.33"
tauri-plugin-notification = "2"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(unix)'.dependencies]
# Already in the dependency graph. Use the platform's siginfo_t/WAIT constants
# instead of duplicating incompatible Linux/macOS FFI layouts.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Reuse the notification plugin's Windows implementation, but register and use
# our own identity for unpackaged builds instead of the PowerShell fallback.
tauri-winrt-notification = "0.8.1"
windows-registry = "0.6"

[patch.crates-io]
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater" }
