name: Build application bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-unix:
    name: ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    env:
      TAURI_CREATE_UPDATER_ARTIFACTS: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      UPDATE_ARCH: ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            package: whispertube-macos-arm64
            architecture: arm64
            setup_script: setup-macos.sh
            build_script: build-macos.sh
          - os: macos-15-intel
            package: whispertube-macos-x64
            architecture: x64
            setup_script: setup-macos.sh
            build_script: build-macos.sh
          - os: ubuntu-24.04
            package: whispertube-linux-x64
            architecture: x64
            setup_script: setup-linux.sh
            build_script: build-linux.sh

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            ffmpeg \
            cmake \
            pkg-config \
            git \
            nasm \
            xz-utils

      - name: Prepare native runtime
        shell: bash
        env:
          SETUP_SCRIPT: ${{ matrix.setup_script }}
        run: |
          set -euo pipefail
          chmod +x "scripts/$SETUP_SCRIPT"
          "scripts/$SETUP_SCRIPT"

      - name: Build native application bundle
        shell: bash
        env:
          BUILD_SCRIPT: ${{ matrix.build_script }}
        run: |
          set -euo pipefail
          chmod +x "scripts/$BUILD_SCRIPT"
          "scripts/$BUILD_SCRIPT"

      - name: Verify FFmpeg dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg_path="src-tauri/runtime/$([[ "$RUNNER_OS" == 'macOS' ]] && echo macos || echo linux)/ffmpeg"
          "$ffmpeg_path" -version
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            if otool -L "$ffmpeg_path" | grep -Eq '/opt/homebrew|/usr/local/opt|/opt/local'; then
              echo "FFmpeg bundle still links to a macOS package manager path." >&2
              exit 1
            fi
          else
            dependencies="$(ldd "$ffmpeg_path" 2>&1 || true)"
            if grep -Eq 'not found|libav(util|codec|format|device|filter|swscale|swresample|postproc)' <<<"$dependencies"; then
              echo "FFmpeg bundle has missing or external FFmpeg library dependencies." >&2
              exit 1
            fi
          fi

      - name: Collect native installers and checksums
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/release/bundle"
          if [[ ! -d "$bundle_root" ]]; then
            echo "Tauri bundle directory tidak ditemukan: $bundle_root" >&2
            exit 1
          fi

          package_dir="$RUNNER_TEMP/packages"
          mkdir -p "$package_dir"
          installers=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            while IFS= read -r installer; do
              installers+=("$installer")
            done < <(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print)
          else
            while IFS= read -r installer; do
              installers+=("$installer")
            done < <(find "$bundle_root/deb" "$bundle_root/appimage" -maxdepth 1 -type f \( -name '*.deb' -o -name '*.AppImage' \) -print)
          fi

          if (( ${#installers[@]} == 0 )); then
            echo "Installer native tidak ditemukan di $bundle_root" >&2
            exit 1
          fi

          for installer in "${installers[@]}"; do
            filename="$(basename "$installer")"
            cp "$installer" "$package_dir/$filename"
            if command -v sha256sum >/dev/null 2>&1; then
              (cd "$package_dir" && sha256sum "$filename" > "$filename.sha256")
            else
              (cd "$package_dir" && shasum -a 256 "$filename" > "$filename.sha256")
            fi
          done

          if [[ "$TAURI_CREATE_UPDATER_ARTIFACTS" == "true" ]]; then
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              updater_bundle="$(find "$bundle_root/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
              if [[ -z "$updater_bundle" || ! -f "$updater_bundle.sig" ]]; then
                echo "Artifact updater macOS atau signature tidak ditemukan di $bundle_root/macos" >&2
                exit 1
              fi
              updater_name="$(basename "${updater_bundle%.app.tar.gz}")-${UPDATE_ARCH}.app.tar.gz"
              cp "$updater_bundle" "$package_dir/$updater_name"
              cp "$updater_bundle.sig" "$package_dir/$updater_name.sig"
            else
              updater_bundle="$(find "$bundle_root/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
              if [[ -z "$updater_bundle" || ! -f "$updater_bundle.sig" ]]; then
                echo "Artifact updater Linux atau signature tidak ditemukan di $bundle_root/appimage" >&2
                exit 1
              fi
              cp "$updater_bundle.sig" "$package_dir/$(basename "$updater_bundle").sig"
            fi
          fi

      - name: Upload application bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.package }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: whispertube-windows-x64
    runs-on: windows-2025
    env:
      TAURI_CREATE_UPDATER_ARTIFACTS: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Prepare native runtime
        shell: pwsh
        run: .\scripts\setup-windows.ps1

      - name: Build Windows NSIS installer
        shell: pwsh
        run: .\scripts\build-windows.ps1

      - name: Collect Windows installer and checksum
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $PWD 'src-tauri\target\release\bundle\nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundleRoot -Filter '*.exe' -File)
          if ($installers.Count -eq 0) {
            throw "Installer NSIS tidak ditemukan di $bundleRoot"
          }
          $packageDir = Join-Path $env:RUNNER_TEMP 'packages'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          foreach ($installer in $installers) {
            $destination = Join-Path $packageDir $installer.Name
            Copy-Item -LiteralPath $installer.FullName -Destination $destination
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$destination.sha256"
            if ($env:TAURI_CREATE_UPDATER_ARTIFACTS -eq 'true') {
              $signaturePath = "$($installer.FullName).sig"
              if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
                throw "Signature updater tidak ditemukan: $signaturePath"
              }
              Copy-Item -LiteralPath $signaturePath -Destination (Join-Path $packageDir "$($installer.Name).sig")
            }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: whispertube-windows-x64
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish application release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-unix
      - build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source for release validation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download application bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: packages
          merge-multiple: true

      - name: Generate updater manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          find_asset() {
            local pattern="$1"
            find packages -maxdepth 1 -type f -iname "$pattern" -print -quit
          }

          version="${RELEASE_TAG#v}"
          package_version="$(jq -r '.version' package.json)"
          tauri_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          cargo_version="$(sed -n '/^\[package\]/,/^\[/p' src-tauri/Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -n 1)"

          if [[ "$package_version" != "$version" || "$tauri_version" != "$version" || "$cargo_version" != "$version" ]]; then
            echo "Versi release tidak konsisten: tag=$version package.json=$package_version tauri.conf.json=$tauri_version Cargo.toml=$cargo_version" >&2
            exit 1
          fi

          windows_asset="$(find_asset '*.exe')"
          mac_x64_asset="$(find_asset '*-x64.app.tar.gz')"
          mac_arm64_asset="$(find_asset '*-arm64.app.tar.gz')"
          linux_asset="$(find_asset '*.AppImage')"

          for required in "$windows_asset" "$mac_x64_asset" "$mac_arm64_asset" "$linux_asset"; do
            if [[ -z "$required" || ! -f "$required" || ! -f "$required.sig" ]]; then
              echo "Artifact updater atau signature tidak lengkap: ${required:-<kosong>}" >&2
              exit 1
            fi
          done

          release_base="https://github.com/${RELEASE_REPOSITORY}/releases/download/${RELEASE_TAG}"
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n \
            --arg version "$version" \
            --arg notes "WhisperTube ${version} application update." \
            --arg pub_date "$pub_date" \
            --arg windows_url "${release_base}/$(basename "$windows_asset")" \
            --arg windows_signature "$(cat "$windows_asset.sig")" \
            --arg mac_x64_url "${release_base}/$(basename "$mac_x64_asset")" \
            --arg mac_x64_signature "$(cat "$mac_x64_asset.sig")" \
            --arg mac_arm64_url "${release_base}/$(basename "$mac_arm64_asset")" \
            --arg mac_arm64_signature "$(cat "$mac_arm64_asset.sig")" \
            --arg linux_url "${release_base}/$(basename "$linux_asset")" \
            --arg linux_signature "$(cat "$linux_asset.sig")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { url: $windows_url, signature: $windows_signature },
                "darwin-x86_64": { url: $mac_x64_url, signature: $mac_x64_signature },
                "darwin-aarch64": { url: $mac_arm64_url, signature: $mac_arm64_signature },
                "linux-x86_64": { url: $linux_url, signature: $linux_signature }
              }
            }' > packages/latest.json

          jq . packages/latest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          notes=$(cat <<'EOF'
          This is a public beta build. Windows is unsigned and macOS uses an ad-hoc signature; macOS is not notarized by Apple.

          Installation:
          - Windows x64: download the `.exe`. If SmartScreen appears, choose **More info** then **Run anyway**. Do not disable Microsoft Defender globally.
          - macOS Apple Silicon: download the `aarch64.dmg`.
          - macOS Intel: download the `x64.dmg`.
          - macOS first launch: move WhisperTube to Applications. If Gatekeeper blocks it, open **System Settings > Privacy & Security > Open Anyway**. Do not disable Gatekeeper globally.
          - Linux x64 AppImage: run `chmod +x WhisperTube_*.AppImage`, then execute the file.
          - Debian/Ubuntu x64: run `sudo apt install ./WhisperTube_*_amd64.deb`.

          Every installer has a matching `.sha256` file for integrity verification. Models are downloaded by the app when first selected.
          EOF
          )

          gh release create "$GITHUB_REF_NAME" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "WhisperTube application $GITHUB_REF_NAME" \
            --notes "$notes" \
            "${prerelease_args[@]}"
