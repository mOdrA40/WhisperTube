<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background glow & fill gradients -->
    <radialGradient id="outer-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2E55" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="body-grad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1435" />
      <stop offset="50%" stop-color="#141829" />
      <stop offset="100%" stop-color="#0E1220" />
    </linearGradient>

    <linearGradient id="border-grad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="45%" stop-color="#A855F7" />
      <stop offset="80%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="wave-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5B37" />
      <stop offset="100%" stop-color="#FF2E55" />
    </linearGradient>

    <linearGradient id="wave-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF4071" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>

    <linearGradient id="wave-3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="wave-4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="wave-5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <rect x="6" y="6" width="116" height="116" rx="36" fill="url(#outer-glow)" />

  <!-- Outer Tube Chassis with gradient border -->
  <rect x="14" y="22" width="100" height="84" rx="26" fill="url(#body-grad)" stroke="url(#border-grad)" stroke-width="2.5" />

  <!-- Specular subtle inner shine -->
  <path d="M22 28 C45 23, 83 23, 106 28 C108 28.5, 110 30, 110 33 C110 37, 18 37, 18 33 C18 30, 20 28.5, 22 28 Z" fill="#ffffff" fill-opacity="0.08" />

  <!-- The Resonance Core: Equalizer Waveform structured in a forward-facing Play arrow rhythm -->
  <!-- Wave bar 1: Bass / Initial Strike -->
  <rect x="36" y="52" width="6.5" height="24" rx="3.25" fill="url(#wave-1)" filter="url(#neon-glow)" />

  <!-- Wave bar 2: Rising Amplitude -->
  <rect x="47" y="42" width="6.5" height="44" rx="3.25" fill="url(#wave-2)" filter="url(#neon-glow)" />

  <!-- Wave bar 3: Peak Resonance (Center Crest of the Play shape) -->
  <rect x="58" y="34" width="7" height="60" rx="3.5" fill="url(#wave-3)" filter="url(#neon-glow)" />

  <!-- Wave bar 4: High Harmonic / Play Angle Descent -->
  <rect x="70" y="44" width="6.5" height="40" rx="3.25" fill="url(#wave-4)" filter="url(#neon-glow)" />

  <!-- Wave bar 5: Crisp Whisper Tip -->
  <rect x="81" y="55" width="6" height="18" rx="3" fill="url(#wave-5)" filter="url(#neon-glow)" />

  <!-- Play Point Tip Dot / Whisper Particle -->
  <circle cx="94" cy="64" r="3" fill="#00F5D4" filter="url(#neon-glow)" />
</svg>
